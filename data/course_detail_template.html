<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__COURSE_NAME__ — Course Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <header class="site-header">
    <div class="shell">
      <div class="brand">Microlearning <span class="brand-mark">Portal</span></div>
      <div class="student-chip">
        <span id="student-id-display">—</span>
        <button id="sign-out-btn" type="button">Not you?</button>
      </div>
    </div>
  </header>

  <main>
    <div class="shell">
      <a class="back-to-courses" href="courses.html">&larr; All courses</a>

      <div class="page-title-row">
        <p class="eyebrow"><span class="code-inline">__COURSE_CODE__</span> &middot; __COURSE_NUMBER__</p>
        <h1>__COURSE_NAME__</h1>
      </div>

      <div class="course-progress-summary">
        <span class="course-progress-label" id="progress-label"><strong>0</strong> of __TOTAL_LESSONS__ lessons completed</span>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <span class="course-progress-label" id="progress-pct">0%</span>
      </div>

      <div class="course-list" id="course-list">
        <!-- populated by JS from CourseCatalog, filtered to this course -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="shell">Microlearning Portal · your progress is tracked automatically per lesson</div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/course-catalog.js"></script>
  <script src="js/progress-sync.js"></script>
  <script>
    (function () {
      const THIS_COURSE_ID = '__COURSE_ID__';
      const CHECK_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const studentId = Storage.getStudentId();
      if (!studentId) {
        window.location.href = 'index.html';
        return;
      }
      document.getElementById('student-id-display').textContent = studentId;

      document.getElementById('sign-out-btn').addEventListener('click', function () {
        Storage.clearStudentId();
        window.location.href = 'index.html';
      });

      const course = CourseCatalog.find(function (c) { return c.courseId === THIS_COURSE_ID; });
      if (!course) {
        document.getElementById('course-list').textContent = 'This course could not be found.';
        return;
      }

      const listEl = document.getElementById('course-list');

      // Reads which chapters are currently expanded in the DOM, keyed by
      // chapter index, so a re-render (triggered after cross-device
      // progress syncs in — see ProgressSync.pull below) doesn't collapse
      // a chapter the student already opened themselves. Returns null on
      // the very first render (nothing in the DOM yet), which tells
      // render() to fall back to its own auto-open-first-unfinished logic.
      function captureOpenState() {
        const cards = listEl.querySelectorAll('.course-card');
        if (cards.length === 0) return null;
        return Array.prototype.map.call(cards, function (el) { return el.open; });
      }

      // Builds the progress bar + chapter/lesson list from local completion
      // state. Safe to call more than once (e.g. once immediately, then
      // again after ProgressSync.pull merges in cross-device completions) —
      // it fully clears and rebuilds #course-list each time.
      //
      // NOTE: the "Completed" badge reflects this student's Activity Log
      // history (local flags, refreshed from the backend via
      // ProgressSync — see progress-sync.js). It is NOT a second source of
      // truth — the instructor's Dashboard sheet remains authoritative for
      // grading/analytics purposes; this is purely a student-facing
      // convenience.
      function render(openState) {
        // ---- Progress bar ----
        const completed = Storage.countCompletedForCourse(course.courseId);
        const total = course.totalLessons;
        const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
        document.getElementById('progress-label').innerHTML = '<strong>' + completed + '</strong> of ' + total + ' lessons completed';
        document.getElementById('progress-pct').textContent = pct + '%';
        document.getElementById('progress-fill').style.width = pct + '%';

        // ---- Chapter / lesson list ----
        listEl.innerHTML = '';

        const chapterCompletion = course.chapters.map(function (chapter) {
          const done = chapter.lessons.filter(function (lesson) {
            return Storage.isLessonCompletedLocally(course.courseId, chapter.chapterId, lesson.lessonNum);
          }).length;
          return { done: done, total: chapter.lessons.length, finished: done === chapter.lessons.length };
        });

        // First render (openState is null): auto-open the first
        // not-yet-finished chapter. Re-render (openState provided):
        // restore exactly what the student had open/closed themselves.
        let autoOpenIdx = -1;
        if (!openState) {
          autoOpenIdx = chapterCompletion.findIndex(function (c) { return !c.finished; });
          if (autoOpenIdx === -1) autoOpenIdx = 0;
        }

        course.chapters.forEach(function (chapter, idx) {
          const chapterLessonsDone = chapterCompletion[idx].done;
          const chapterDone = chapterCompletion[idx].finished;

          const chapterCard = document.createElement('details');
          chapterCard.className = 'course-card';
          chapterCard.open = openState ? !!openState[idx] : (idx === autoOpenIdx);

          const summary = document.createElement('summary');
          summary.innerHTML =
            '<div class="course-card-title">' +
              '<span class="course-id-tag">Ch. ' + chapter.chapterId + '</span>' +
              '<h2>' + chapter.chapterTitle + '</h2>' +
            '</div>' +
            '<span class="chapter-progress-tag">' + chapterLessonsDone + '/' + chapter.lessons.length + (chapterDone ? ' \u2713' : '') + '</span>' +
            '<svg class="disclosure-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          chapterCard.appendChild(summary);

          const chapterBlock = document.createElement('div');
          chapterBlock.className = 'chapter-block';

          chapter.lessons.forEach(function (lesson) {
            const row = document.createElement('div');
            row.className = 'lesson-row';

            const link = document.createElement('a');
            link.className = 'lesson-link';
            link.href = 'courses/' + course.courseId + '/chapter-' + chapter.chapterId + '/' + lesson.lessonId + '/';
            link.textContent = 'Lesson ' + lesson.lessonNum + ': ' + lesson.lessonTitle;
            row.appendChild(link);

            const isCompleted = Storage.isLessonCompletedLocally(course.courseId, chapter.chapterId, lesson.lessonNum);
            const status = document.createElement('span');
            status.className = 'lesson-status ' + (isCompleted ? 'completed' : 'not-started');
            status.innerHTML = isCompleted ? (CHECK_ICON + '<span>Completed</span>') : '<span>Not started</span>';
            row.appendChild(status);
            if (isCompleted) row.classList.add('lesson-row-completed');

            chapterBlock.appendChild(row);
          });

          chapterCard.appendChild(chapterBlock);
          listEl.appendChild(chapterCard);
        });
      }

      render(null);

      // Cross-device sync: pull this student's completions from the
      // backend (any device/browser) and, only if that actually changes
      // anything this browser didn't already know about, re-render so the
      // student doesn't have to open a lesson first to see it reflected
      // here. Runs in the background — the page is already fully usable
      // before this resolves.
      ProgressSync.pull(studentId, function () {
        render(captureOpenState());
      });
    })();
  </script>
</body>
</html>
